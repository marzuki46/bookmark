name: Android APK

on:
  push:
    branches: [ master, main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: https://bookmark.juki.eu.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK, so drive sdkmanager
      # directly rather than depending on a third-party setup action.
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # The Gradle wrapper JAR is a binary and is not committed, so generate it
      # once here. Later runs (and Android Studio users) can rely on the
      # gradlew/gradle-wrapper.jar produced by this step.
      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          curl -sSL "https://services.gradle.org/distributions/gradle-8.9-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --no-daemon

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PapiBaseUrl=$API_BASE_URL

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: keuangan-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
